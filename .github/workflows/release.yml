name: Beta release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-executable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: python -m pytest
      - run: python -m build
      - shell: cmd
        run: build_exe.bat
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ZIPMarkdown-${{ github.ref_name }}-windows
          path: |
            dist/ZIPMarkdown.exe
            dist/ZIPMarkdown.exe.sha256
            dist/zipmarkdown-*.whl
            dist/zipmarkdown-*.tar.gz
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          prerelease: ${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') || contains(github.ref_name, '-') }}
          files: |
            dist/ZIPMarkdown.exe
            dist/ZIPMarkdown.exe.sha256
            dist/zipmarkdown-*.whl
            dist/zipmarkdown-*.tar.gz
          body: |
            ZIPMarkdown ${{ github.ref_name }}.
            This executable is not Authenticode-signed. Windows SmartScreen may warn.
