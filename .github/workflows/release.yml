name: Beta release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*a[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*b[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*rc[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Verify release tag and package version
        shell: bash
        run: |
          python - <<'PY'
          import os, re, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+(?:a|b|rc)[0-9]+", tag) is None:
              raise SystemExit(f"unsupported release tag: {tag}")
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag} does not match pyproject version {version}")
          PY
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev,gui]"
      - run: python -m compileall -q .
      - run: python -m ruff check .
      - run: python -m pytest tests/unit tests/integration --cov --cov-report=term-missing --cov-fail-under=80
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build from the tagged commit
        shell: bash
        run: |
          python -m build
          version="${GITHUB_REF_NAME#v}"
          git archive --format=zip --prefix="ZIPMarkdown-${version}/" \
            --output="dist/ZIPMarkdown-${version}-source.zip" "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-and-source
          if-no-files-found: error
          path: |
            dist/zipmarkdown-*.whl
            dist/zipmarkdown-*.tar.gz
            dist/ZIPMarkdown-*-source.zip

  windows-executable:
    needs: quality-and-package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev,gui]"
      - run: python -m pytest
      - shell: cmd
        run: build_exe.bat
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-executable
          if-no-files-found: error
          path: |
            dist/ZIPMarkdown.exe
            dist/ZIPMarkdown.exe.sha256

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [quality-and-package, windows-executable]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: downloaded
      - name: Assemble release and checksum every attachment
        shell: bash
        run: |
          mkdir release
          find downloaded -type f -exec cp '{}' release/ ';'
          (cd release && find . -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort | xargs sha256sum > RELEASE_SHA256.txt)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          prerelease: true
          fail_on_unmatched_files: true
          files: release/*
          body: |
            ZIPMarkdown ${{ github.ref_name }} beta.

            All attachments were produced from this exact tag. Verify downloads with RELEASE_SHA256.txt and the GitHub build-provenance attestation.
            The Windows executable is not Authenticode-signed; Windows SmartScreen may warn.
