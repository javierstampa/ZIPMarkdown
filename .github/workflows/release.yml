name: Beta release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*a[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*b[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*rc[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Verify release tag and package version
        shell: bash
        run: |
          python - <<'PY'
          import os, re, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+(?:a|b|rc)[0-9]+", tag) is None:
              raise SystemExit(f"unsupported release tag: {tag}")
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag} does not match pyproject version {version}")
          PY
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev,gui]"
      - run: python -m compileall -q .
      - run: python -m ruff check .
      - run: python -m pytest tests/unit tests/integration --cov --cov-report=term-missing --cov-fail-under=80
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build from the tagged commit
        shell: bash
        run: |
          python -m build
          version="${GITHUB_REF_NAME#v}"
          git archive --format=zip --prefix="ZIPMarkdown-${version}/" \
            --output="dist/ZIPMarkdown-${version}-source.zip" "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-and-source
          if-no-files-found: error
          path: |
            dist/zipmarkdown-*.whl
            dist/zipmarkdown-*.tar.gz
            dist/ZIPMarkdown-*-source.zip

  windows-executable:
    needs: quality-and-package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev,gui]"
      - run: python -m pytest
      - shell: cmd
        run: build_exe.bat
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-executable
          if-no-files-found: error
          path: |
            dist/ZIPMarkdown.exe
            dist/ZIPMarkdown.exe.sha256

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [quality-and-package, windows-executable]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: downloaded
      - name: Assemble release and checksum every attachment
        shell: bash
        run: |
          mkdir release
          find downloaded -type f -exec cp '{}' release/ ';'
          (cd release && find . -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort | xargs sha256sum > RELEASE_SHA256.txt)
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: release/*
      - uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          prerelease: true
          fail_on_unmatched_files: true
          files: release/*
          body: |
            ZIPMarkdown ${{ github.ref_name }} beta.

            All attachments were produced from this exact tag. Verify downloads with RELEASE_SHA256.txt and the GitHub build-provenance attestation.
            The Windows executable is not Authenticode-signed; Windows SmartScreen may warn.
