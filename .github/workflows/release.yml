name: Beta release

on:
  push:
    tags: ['v0.1.0-beta']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-executable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: python -m pytest
      - shell: cmd
        run: build_exe.bat
      - uses: actions/upload-artifact@v4
        with:
          name: ZIPMarkdown-v0.1.0-beta-windows
          path: |
            dist/ZIPMarkdown.exe
            dist/ZIPMarkdown.exe.sha256
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: |
            dist/ZIPMarkdown.exe
            dist/ZIPMarkdown.exe.sha256
          body: |
            ZIPMarkdown v0.1.0 beta. This executable is not Authenticode-signed.
            Windows SmartScreen may warn because it is a new unsigned binary.
